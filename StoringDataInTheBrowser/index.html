<html>
  <head>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>
  <body>
    <form id="film-form">
      <label for="title">Название:</label><br />
      <input type="text" id="title" name="title" required /><br />
      <label for="genre">Жанр:</label><br />
      <input type="text" id="genre" name="genre" required /><br />
      <label for="releaseYear">Год:</label><br />
      <input type="text" id="releaseYear" name="releaseYear" required /><br />
      <input type="checkbox" id="isWatched" name="isWatched" />
      <label for="isWatched">Успели посмотреть?</label><br />
      
      <button type="submit" id="submitBtn">Добавить</button>
      <button type="submit" id="cancelUpdateBtn" style="display: none;">
        Отменить редактирование
      </button>
    </form>    
    <select name="select" id="select">
      <option value="">Выберите критерию сортировки</option>
      <option value="title">Название</option>
      <option value="genre">Жанр</option>
      <option value="releaseYear">Год</option>      
    </select>
    <button id="sortBtn">Сортировать</button>
    <table id="film-table">
      <thead>
        <tr>
          <th>Название</th>
          <th>Жанр</th>
          <th>Год</th>
          <th>Успели посмотреть?</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody id="film-tbody">
        <!-- Rows will be inserted here -->
      </tbody>
    </table>
    <script src="script.js"></script>
  </body>
</html>
