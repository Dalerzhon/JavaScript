<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Оформление банковской карты</h1>
        <div class="cardBlock">
            <label for="nameSurname">Введите имя и фамилию:</label>
            <input type="text" class="nameSurname" id="nameSurname" name="nameSurname">
        </div>
        <div class="cardBlock">
            <label for="selectColor">Выберите цвет вашей карты:</label>
            <select id="selectColor" name="selectColor" class="selectColor">
                <option value="redColor">Красный</option>
                <option value="blueColor" selected>Синий</option>
                <option value="greenColor">Зеленый</option>
            </select>
        </div>
        <div class="cardBlock">
            <p id="card" class="card blueColor">Здесь будут ваши данные</p>
        </div> 
        
    </div>
    <script src="index.js">

    </script>
    
</body>
</html>
