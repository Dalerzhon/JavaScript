<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <div class="container">
            <form class="form" action="#">
                <h1>Калькулятор стоимости доставки</h1>
                <div class="formGroup">
                    <label for="nameGoods">Название товара:</label>
                    <input type="text" id="nameGoods" name="nameGoodse" required >
                </div>
                
                <div class="formGroup">
                    <label for="weightGoods">Вес товара (кг):</label>
                    <input type="number" id="weightGoods" name="weightGoods" required>
                </div>
                <div class="formGroup">
                    <label for="distanceDelivery">Расстояние доставки (км):</label>
                    <input type="number" id="distanceDelivery" name="distanceDelivery" required>
                </div>
                <div class="formGroup">
                    <input type="submit" id="btnSubmit" value="Добавить товар">           
                </div> 
            </form>
            <div class="errMassage"></div>
            <table class="productTable">
                <thead>
                    <tr>
                        <th>Название товара</th>
                        <th>Вес (кг)</th>
                        <th>Расстояние (км)</th>
                        <th>Стоимость доставки (руб)</th>
                    </tr>
                </thead>
                
            </table>
        </div>
    </div>
    <script src="index.js">

    </script>
    
</body>
</html>
